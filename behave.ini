[behave]
# Behave configuration for BuyWisely BDD tests

# Test discovery
paths = docs/acceptance/features/
show_skipped = false
show_snippets = false

# Output formatting
format = pretty
color = true
show_timings = true

# Logging
logging_level = INFO
logging_format = %(levelname)s: %(message)s

# Stop on first failure (set to false to run all tests)
stop = false

# Additional options
summary = true
junit = false

# Tags (use to run specific scenarios)
# Run with: behave --tags=@smoke
# Available tags: @smoke, @regression, @wip, @us01-us08
default_tags =

# Exclude patterns (space-separated)
exclude_re = .*\.git.*|.*__pycache__.*
